{% extends "rental/base.html" %}

{% block title %}Confirm Delete | Nestoria - Live Elevated{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="form-card mx-auto text-center">
        <div class="brand-icon-box mx-auto mb-3 bg-danger" style="width: 54px; height: 54px; border-radius: 50%; background: #fee2e2; color: #ef4444;">
            <i class="bi bi-exclamation-triangle fs-3"></i>
        </div>
        <h2 class="fw-bold mb-2">Are you sure?</h2>
        <p class="text-muted mb-4">
            Do you really want to delete this {{ type }}: <strong>{{ object }}</strong>? This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'dashboard' %}" class="btn btn-light rounded-pill px-4 py-2">
                    Cancel
                </a>
                <button type="submit" class="btn btn-danger rounded-pill px-4 py-2 fw-semibold">
                    Confirm Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
